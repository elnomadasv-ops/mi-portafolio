<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto | Rubén Ruiz</title>
    <link href="estilos.css" rel="stylesheet" type="text/css">
    <style>
        .contact-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
        }
        form { background: var(--bg-card); padding: 30px; border-radius: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #2A2A2A;
            border: 1px solid #333;
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">RUBÉN RUIZ <span>| MULTIMEDIA</span></a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="sobre-mi.html">Sobre Mí</a>
            <a href="portafolio-diseno.html">Portafolio</a>
            <a href="blog.html">Blog Periodístico</a>
            <a href="contacto.html" class="btn-primary" style="padding: 6px 16px;">Contacto</a>
        </nav>
    </header>

    <div class="contact-container">
        <div>
            <h1 style="font-family:'Montserrat'; font-size:2.5rem; margin-bottom:20px;">Contacto</h1>
            <p style="color:var(--text-muted); margin-bottom:20px;">¿Tienes un proyecto multimedia en mente o deseas realizar una consulta profesional? Envíame un mensaje.</p>
            <p style="font-weight:600;">rubenruis@gmail.com</p>
        </div>

        <form action="#" method="post">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="servicio">Servicio Solicitado</label>
                <select id="servicio" name="servicio">
                    <option>Diseño Gráfico / Branding</option>
                    <option>Producción Audiovisual</option>
                    <option>Fotografía Profesional</option>
                    <option>Diseño UI/UX</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Enviar Mensaje</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Rubén Daniel Ruiz Cortez. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
